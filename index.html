<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--  -->
    <link rel="stylesheet" href="./style.css"/>
    <!--  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!--  -->
<script src="https://kit.fontawesome.com/3ea42bcb9d.js" crossorigin="anonymous"></script>
</head>
<body>
   <h1 id="output"></h1>
    <div class="container">
        <div class="row row-cols-3">
          <button id="btn" onclick="allClear()">All Clear</button>
          <button id="btn" onclick="remlst()"><i class="fa-solid fa-delete-left"></i></button>
          <button id="btn" onclick="display('+')"><i class="fa-solid fa-plus"></i></button>
          <button id="btn" onclick="display('-')"><i class="fa-solid fa-minus"></i></button>
          <button id="btn" onclick="display('/')"><i class="fa-solid fa-divide"></i></button> 
           <button id="btn" onclick="display('*')"><i class="fa-solid fa-xmark"></i></button>
          <button id="btn" onclick="display(9)">9</button>
          <button id="btn" onclick="display(8)">8</button>
          <button id="btn" onclick="display(7)">7</button>
          <button id="btn" onclick="display(6)">6</button>
          <button id="btn" onclick="display(5)">5</button>
          <button id="btn" onclick="display(4)">4</button>
          <button id="btn" onclick="display(3)">3</button>
          <button id="btn" onclick="display(2)">2</button>
          <button id="btn" onclick="display(1)">1</button>
          <button id="btn" onclick="display(0)">0</button>
          <button id="btn" onclick="display('.')">.</button>
          <button id="btn" onclick="display('=')">=</button>


        </div>
      </div>
      
<script src="./calc.js"></script>
<!--  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
