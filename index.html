<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--  -->
    <link rel="stylesheet" href="./style.css"/>
    <!--  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!--  -->
<script src="https://kit.fontawesome.com/3ea42bcb9d.js" crossorigin="anonymous"></script>
<!--  -->

</head>
<body>
  <div class="mb-3">
    <label for="exampleFormControlTextarea1" class="form-label">Input:</label>
    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
  </div>
  <div class="otp">
    <h1>Output:</h1>
    <h1 id="opt"></h1>
  </div>
  
 
 
  <div class="container mb-5">
    
    <div class="row">
      <div class="col" onclick="display(7)">7</div>
      <div class="col" onclick="display(8)">8</div>
      <div class="col" onclick="display(9)">9</div>
      <div class="col" onclick="display('*')"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="row">
       <div class="col" onclick="display(4)">4</div>
       <div class="col" onclick="display(5)">5</div>
       <div class="col" onclick="display(6)">6</div>
       <div class="col" onclick="display('/')"><i class="fa-solid fa-divide"></i></div>
    </div> <div class="row">
       <div class="col" onclick="display(1)">1</div>
       <div class="col" onclick="display(2)">2</div>
       <div class="col" onclick="display(3)">3</div>
       <div class="col" onclick="display('-')"><i class="fa-solid fa-minus"></i></div>
    </div>
  <div class="row">
     <div class="col" onclick="display('.')">.</div>
     <div class="col" onclick="display(0)">0</div>
     <div class="col" onclick="display('=')"><i class="fa-solid fa-equals"></i></div>
     <div class="col" onclick="display('+')"><i class="fa-solid fa-plus"></i></div>
  </div>
  </div>

  

<script src="./calc.js"></script>
<!--  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
