<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!--  -->
    <link rel="icon" href="./calculator-solid.svg">
    <!--  -->
    <link rel="stylesheet" href="./style.css"/>
    <!--  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!--  -->
<script src="https://kit.fontawesome.com/3ea42bcb9d.js" crossorigin="anonymous"></script>
<!--  -->

</head>
<body>
  <div class="form-floating mx-3 py-1">
    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
    <label for="floatingTextarea">Input</label>
  </div>
  <div class="form-floating mx-3">
    <textarea class="form-control" placeholder="Leave a comment here" id="opt"></textarea>
    <label for="floatingTextarea">Output</label>
  </div>
  
 
 
  <div class="container mt-4">
    <div class="row">
      <div class="col" onclick="alclr()">AC</div>
      <div class="col" onclick="display( '(' )">(</div>
      <div class="col" onclick="display(')')">)</div>
      <div class="col" onclick="del()"><i class="fa-solid fa-delete-left"></i></div>
    </div>
    
    <div class="row">
      <div class="col" onclick="display(7)">7</div>
      <div class="col" onclick="display(8)">8</div>
      <div class="col" onclick="display(9)">9</div>
      <div class="col" onclick="display('*')"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="row">
       <div class="col" onclick="display(4)">4</div>
       <div class="col" onclick="display(5)">5</div>
       <div class="col" onclick="display(6)">6</div>
       <div class="col" onclick="display('/')"><i class="fa-solid fa-divide"></i></div>
    </div> <div class="row">
       <div class="col" onclick="display(1)">1</div>
       <div class="col" onclick="display(2)">2</div>
       <div class="col" onclick="display(3)">3</div>
       <div class="col" onclick="display('-')"><i class="fa-solid fa-minus"></i></div>
    </div>
  <div class="row">
     <div class="col" onclick="display('.')">.</div>
     <div class="col" onclick="display(0)">0</div>
     <div class="col" onclick="display('=')"><i class="fa-solid fa-equals"></i></div>
     <div class="col" onclick="display('+')"><i class="fa-solid fa-plus"></i></div>
  </div>
  </div>
  <footer style="background-color: black; color: white; text-align: center; padding: 10px;">
    © 2025 SAI CHARAN. All rights reserved.
  </footer>
  
  

<script src="./calc.js"></script>
<!--  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
